<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>Kerona on the go</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kerona on the go">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Light, high-contrast palette — the activation is outdoors in daylight,
     where a dark theme washes out at max screen brightness. */
  :root{
    --bg:#f6f1ea; --ink:#1b1512; --muted:#7a6a5d;
    --card:#ffffff; --line:#ddd0c1;
    --amber:#c8761a; --cash:#1f7a4d; --card-pay:#1d5fa8;
    --pad: 10px;
    /* one colour per drink, so the tile is recognised by hue before the word is read */
    --cappuccino:#d3ab7e; --cappuccino-edge:#b08a5d;
    --tea:#b04a33;        --tea-edge:#8d3826;
    --hotchoc:#4d3123;    --hotchoc-edge:#33200f;
    --soup:#e6b32a;       --soup-edge:#c1901a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  button{font:inherit; color:inherit; touch-action:manipulation; cursor:pointer;}

  .stage{perspective:1800px; height:100dvh; height:100vh;}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;
        transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        display:flex;flex-direction:column;
        padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .face.back{transform:rotateY(180deg);}

  /* ---- header (the flip target) ---- */
  .bar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:14px 16px; background:var(--ink); color:#fff;
    font-weight:700; letter-spacing:.04em; font-size:14px; text-transform:uppercase;
    border:0; width:100%; text-align:left;
  }
  .bar .hint{font-size:13px; font-weight:600; opacity:.75; letter-spacing:.02em; text-transform:none;}
  .bar:active{background:#000;}

  /* ---- line-art icons ---- */
  .ico{fill:none; stroke:currentColor; stroke-width:2.5;
       stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto;}
  .prod .ico{width:clamp(52px,19vw,88px); height:clamp(52px,19vw,88px); stroke-width:2.2;}

  /* ---- basket strip (sits under the drinks, above the pay buttons) ---- */
  .basket{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin:0 var(--pad) var(--pad); padding:10px 12px 10px 16px;
    background:var(--card); border:2px solid var(--line); border-radius:14px;
    min-height:66px;
  }
  .basket .amt{display:flex; align-items:baseline; gap:8px;}
  .basket .amt b{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1;}
  .basket .amt i{font-style:normal; font-size:17px; font-weight:700;}
  .basket .amt small{font-size:17px; font-weight:700; color:var(--muted);}
  .basket.empty .amt{color:var(--muted); font-weight:600; font-size:17px;}
  .undo{
    border:2px solid var(--line); background:#fff; border-radius:10px;
    padding:13px 18px; font-weight:800; font-size:15px; color:var(--ink);
  }
  .undo:disabled{opacity:.3;}
  .undo:active:not(:disabled){background:#f0e7db;}

  /* ---- product grid ---- */
  .grid{
    flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    gap:var(--pad); padding:var(--pad); min-height:0;
  }
  .prod{
    position:relative; border:3px solid; border-radius:16px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; padding:8px;
    font-weight:800; font-size:clamp(17px,4.6vw,24px); line-height:1.1; text-align:center;
    transition:transform .06s ease, filter .06s ease;
  }
  .prod:active{transform:scale(.97); filter:brightness(1.1);}
  .prod[data-key="cappuccino"]{background:var(--cappuccino); border-color:var(--cappuccino-edge); color:#2b1c0e;}
  .prod[data-key="tea"]       {background:var(--tea);        border-color:var(--tea-edge);        color:#fff;}
  .prod[data-key="hotchoc"]   {background:var(--hotchoc);    border-color:var(--hotchoc-edge);    color:#fff;}
  .prod[data-key="soup"]      {background:var(--soup);       border-color:var(--soup-edge);       color:#2b1c0e;}
  /* white pill reads against all four tile colours */
  .prod .n{
    display:none; min-width:52px; padding:4px 12px; border-radius:99px;
    background:#fff; color:var(--ink); font-size:26px; font-weight:800;
    box-shadow:0 2px 6px rgba(0,0,0,.18);
  }
  .prod.has .n{display:block;}

  /* ---- pay buttons ---- */
  .pay{
    position:relative;   /* anchors the toast directly above this row */
    flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:var(--pad);
    padding:0 var(--pad) calc(var(--pad) + 4px);
  }
  .pay button{
    border:0; border-radius:16px; color:#fff; padding:20px 8px;
    font-size:22px; font-weight:800; letter-spacing:.03em;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:transform .06s ease, filter .06s ease;
  }
  .pay button span{font-size:14px; font-weight:600; opacity:.9;}
  #cash{background:var(--cash);} #cardpay{background:var(--card-pay);}
  .pay button:active:not(:disabled){transform:scale(.97); filter:brightness(1.15);}
  /* ID selectors above out-rank a plain `.pay button:disabled`, so match on ID here too. */
  #cash:disabled, #cardpay:disabled{background:#cfc4b6; color:#f6f1ea;}

  /* ---- toast (undo last sale) ----
     Sits above the pay row rather than over it, so CASH and CARD stay fully
     visible while it is up. Fades rather than sliding, so it never lands on
     top of the buttons on the way out. */
  .toast{
    /* left/right match .pay's own padding so the strip lines up with the buttons */
    position:absolute; left:var(--pad); right:var(--pad); bottom:calc(100% + 8px);
    background:var(--ink); color:#fff; border-radius:12px; padding:8px 8px 8px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-weight:700; font-size:15px; box-shadow:0 6px 20px rgba(0,0,0,.28); z-index:5;
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  .toast button{
    background:#fff; color:var(--ink); border:0; border-radius:9px;
    padding:10px 16px; font-weight:800; font-size:15px;
  }

  /* ---- totals face ---- */
  .totals{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 0 16px;}
  .hero{padding:20px 18px 16px; background:var(--card); border-bottom:2px solid var(--line);}
  .hero .big{font-size:44px; font-weight:800; letter-spacing:-.02em; line-height:1;}
  .hero .sub{margin-top:8px; color:var(--muted); font-weight:600; font-size:15px;}
  .scope{display:flex; gap:8px; margin-top:14px;}
  .scope button{
    flex:1; border:2px solid var(--line); background:#fff; border-radius:10px;
    padding:10px; font-weight:700; font-size:14px; color:var(--muted);
  }
  .scope button.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  h2{margin:20px 18px 8px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  table{width:100%; border-collapse:collapse; background:var(--card);
        border-top:2px solid var(--line); border-bottom:2px solid var(--line);}
  td{padding:13px 18px; border-bottom:1px solid #eee4d7; font-size:17px;}
  tr:last-child td{border-bottom:0;}
  td.q{text-align:right; width:22%; font-weight:800;}
  td.r{text-align:right; width:30%; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;}
  .acts{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:18px;}
  .acts button{
    border:2px solid var(--ink); background:var(--ink); color:#fff;
    border-radius:12px; padding:16px 8px; font-weight:700; font-size:15px;
  }
  .acts button.ghost{background:#fff; color:var(--ink);}
  .note{padding:0 18px; color:var(--muted); font-size:13px; line-height:1.5;}
  /* Small print, and it looks like small print — a press-and-hold, not a button
     you can fire by accident. The 3s hold is enforced in the JS. */
  .reset{
    display:block; margin:14px auto 4px; border:0; background:none;
    color:var(--muted); font-size:13px; font-weight:600;
    text-decoration:underline; text-underline-offset:3px; padding:8px 12px;
  }
  .reset.holding{color:#a32020; text-decoration:none; font-weight:800;}
</style>
</head>

<div class="stage">
  <div class="card" id="card">

    <!-- ================= TRACKING FACE ================= -->
    <section class="face front">
      <button class="bar" id="toTotals">
        <span>Kerona on the go</span>
        <span class="hint">Totals ▸</span>
      </button>

      <div class="grid" id="grid"></div>

      <div class="basket empty" id="basket">
        <div class="amt" id="basketAmt">Tap a drink to start</div>
        <button class="undo" id="undoItem" disabled>Undo</button>
      </div>

      <div class="pay">
        <button id="cash" disabled>CASH<span id="cashAmt"></span></button>
        <button id="cardpay" disabled>CARD<span id="cardAmt"></span></button>

        <div class="toast" id="toast">
          <span id="toastMsg"></span>
          <button id="undoSale">UNDO</button>
        </div>
      </div>
    </section>

    <!-- ================= TOTALS FACE ================= -->
    <section class="face back">
      <button class="bar" id="toTill">
        <span>Totals</span>
        <span class="hint">◂ Back to till</span>
      </button>

      <div class="totals">
        <div class="hero">
          <div class="big" id="heroRand">R0</div>
          <div class="sub" id="heroSub">0 cups · 0 sales</div>
          <div class="scope">
            <button id="scopeToday" class="on">Today</button>
            <button id="scopeAll">Both days</button>
          </div>
        </div>

        <h2>By product</h2>
        <table><tbody id="byProduct"></tbody></table>

        <h2>By payment</h2>
        <table><tbody id="byPayment"></tbody></table>

        <div class="acts">
          <button id="copyBtn">Copy summary</button>
          <button id="csvBtn" class="ghost">Download CSV</button>
        </div>
        <p class="note" id="foot"></p>
        <button class="reset" id="resetLink">Reset local data</button>
      </div>
    </section>

  </div>
</div>

<script>
(() => {
  'use strict';

  // ---- configuration -------------------------------------------------------
  const PRICE = 15;                    // R per cup, flat across all four products
  const STORE = 'kerona-till-v1';
  const PRODUCTS = [
    { key:'cappuccino', label:'Cappuccino' },
    { key:'tea',        label:'Tea' },
    { key:'hotchoc',    label:'Hot Chocolate' },
    { key:'soup',       label:'Soup' },
  ];

  // ---- state ---------------------------------------------------------------
  let sales  = load();          // committed transactions
  let basket = [];              // product keys in tap order (so "undo item" is exact)
  let scope  = 'today';
  let toastSaleId = null, toastTimer = null;

  function load(){
    try { return JSON.parse(localStorage.getItem(STORE)) || []; }
    catch { return []; }
  }
  function save(){
    try { localStorage.setItem(STORE, JSON.stringify(sales)); }
    catch (e) { alert('Could not save to this device. Do not clear the browser data.'); }
  }

  const $ = id => document.getElementById(id);
  const rand = n => 'R' + n.toLocaleString('en-ZA');
  const dayOf = ts => { const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const buzz = ms => { if (navigator.vibrate) navigator.vibrate(ms); };

  // ---- product grid --------------------------------------------------------
  const grid = $('grid');
  PRODUCTS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'prod'; b.dataset.key = p.key;
    b.innerHTML = '<svg class="ico" viewBox="0 0 64 64"><use href="#s-' + p.key + '"/></svg>' +
                  '<span>' + p.label + '</span><span class="n">0</span>';
    b.addEventListener('click', () => {
      // starting the next customer ends the undo window — and gets the strip out
      // of the way of the basket counter it would otherwise cover
      hideToast();
      basket.push(p.key); buzz(12); renderTill();
    });
    grid.appendChild(b);
  });

  function renderTill(){
    const counts = {};
    basket.forEach(k => counts[k] = (counts[k]||0) + 1);

    grid.querySelectorAll('.prod').forEach(b => {
      const n = counts[b.dataset.key] || 0;
      b.classList.toggle('has', n > 0);
      b.querySelector('.n').textContent = n;
    });

    const qty = basket.length, amount = qty * PRICE;
    const strip = $('basket');
    strip.classList.toggle('empty', qty === 0);
    $('basketAmt').innerHTML = qty === 0
      ? 'Tap a drink to start'
      : '<b>' + qty + '</b><i>' + (qty === 1 ? 'cup' : 'cups') + '</i><small>' + rand(amount) + '</small>';
    $('undoItem').disabled = qty === 0;
    $('cash').disabled = $('cardpay').disabled = qty === 0;
    $('cashAmt').textContent = $('cardAmt').textContent = qty ? rand(amount) : '';
  }

  $('undoItem').addEventListener('click', () => { basket.pop(); buzz(20); renderTill(); });

  // ---- submitting a sale ---------------------------------------------------
  function submit(method){
    if (!basket.length) return;
    const items = {};
    PRODUCTS.forEach(p => items[p.key] = 0);
    basket.forEach(k => items[k]++);

    const sale = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      ts: Date.now(), items,
      qty: basket.length, method, amount: basket.length * PRICE
    };
    sales.push(sale); save();
    basket = []; renderTill();
    buzz(method === 'cash' ? [18,50,18] : 30);
    showToast(sale);
  }
  $('cash').addEventListener('click', () => submit('cash'));
  $('cardpay').addEventListener('click', () => submit('card'));

  function showToast(sale){
    toastSaleId = sale.id;
    $('toastMsg').textContent = 'Recorded · ' + rand(sale.amount) + ' ' + sale.method.toUpperCase();
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4000);
  }
  function hideToast(){ $('toast').classList.remove('show'); toastSaleId = null; }

  $('undoSale').addEventListener('click', () => {
    if (!toastSaleId) return;
    const i = sales.findIndex(s => s.id === toastSaleId);
    if (i > -1) { sales.splice(i,1); save(); }
    buzz([20,60,20]); hideToast(); renderTotals();
  });

  // ---- flip ----------------------------------------------------------------
  // Only the header bar flips. The product grid must never flip by accident
  // mid-service, so the tap target is the strip at the top, not the whole screen.
  $('toTotals').addEventListener('click', () => {
    hideToast(); renderTotals(); $('card').classList.add('flipped');
  });
  $('toTill').addEventListener('click', () => $('card').classList.remove('flipped'));

  // ---- totals --------------------------------------------------------------
  function inScope(){
    if (scope === 'all') return sales;
    const t = dayOf(Date.now());
    return sales.filter(s => dayOf(s.ts) === t);
  }

  function summarise(list){
    const out = {
      qty:0, amount:0, sales:list.length,
      byProduct:{}, byPayment:{ cash:{qty:0,amount:0}, card:{qty:0,amount:0} }
    };
    PRODUCTS.forEach(p => out.byProduct[p.key] = 0);
    list.forEach(s => {
      out.qty += s.qty; out.amount += s.amount;
      PRODUCTS.forEach(p => out.byProduct[p.key] += (s.items[p.key] || 0));
      const m = out.byPayment[s.method];
      if (m) { m.qty += s.qty; m.amount += s.amount; }
    });
    return out;
  }

  function renderTotals(){
    const t = summarise(inScope());
    $('heroRand').textContent = rand(t.amount);
    $('heroSub').textContent  = t.qty + ' cups · ' + t.sales + ' sales';
    $('scopeToday').classList.toggle('on', scope === 'today');
    $('scopeAll').classList.toggle('on', scope === 'all');

    $('byProduct').innerHTML = PRODUCTS.map(p =>
      '<tr><td>' + p.label + '</td><td class="q">' + t.byProduct[p.key] +
      '</td><td class="r">' + rand(t.byProduct[p.key] * PRICE) + '</td></tr>').join('');

    $('byPayment').innerHTML = ['cash','card'].map(m =>
      '<tr><td>' + (m === 'cash' ? 'Cash' : 'Card') + '</td><td class="q">' + t.byPayment[m].qty +
      '</td><td class="r">' + rand(t.byPayment[m].amount) + '</td></tr>').join('');

    $('foot').textContent = 'R' + PRICE + ' per cup · ' + sales.length +
      ' sales stored on this device' + (sales.length ? ' since ' + new Date(sales[0].ts).toLocaleString('en-ZA') : '');
  }

  $('scopeToday').addEventListener('click', () => { scope = 'today'; renderTotals(); });
  $('scopeAll').addEventListener('click',   () => { scope = 'all';   renderTotals(); });

  // ---- export --------------------------------------------------------------
  function summaryText(){
    const list = inScope(), t = summarise(list);
    const when = scope === 'today'
      ? new Date().toLocaleDateString('en-ZA', {weekday:'short', day:'numeric', month:'short', year:'numeric'})
      : 'All days';
    const lines = [
      'KERONA · König point', when, '',
      'Cups: ' + t.qty + '   Revenue: ' + rand(t.amount), ''
    ];
    PRODUCTS.forEach(p => lines.push(
      p.label.padEnd(14) + String(t.byProduct[p.key]).padStart(4) + '   ' + rand(t.byProduct[p.key] * PRICE)));
    lines.push('');
    ['cash','card'].forEach(m => lines.push(
      (m === 'cash' ? 'Cash' : 'Card').padEnd(14) + String(t.byPayment[m].qty).padStart(4) + '   ' + rand(t.byPayment[m].amount)));
    lines.push('', 'Sales: ' + t.sales + ' · R' + PRICE + '/cup');
    return lines.join('\n');
  }

  $('copyBtn').addEventListener('click', async () => {
    const text = summaryText();
    try {
      await navigator.clipboard.writeText(text);
      flash($('copyBtn'), 'Copied ✓');
    } catch {
      // Clipboard API needs a secure context; fall back to a manual select.
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;top:10%;left:5%;width:90%;height:60%;font-size:14px;z-index:99';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); flash($('copyBtn'), 'Copied ✓'); } catch {}
      setTimeout(() => ta.remove(), 100);
    }
  });

  $('csvBtn').addEventListener('click', () => {
    const head = ['datetime','date','time', ...PRODUCTS.map(p => p.key), 'cups','method','amount_zar'];
    const rows = inScope().map(s => {
      const d = new Date(s.ts);
      return [ d.toISOString(), dayOf(s.ts), d.toLocaleTimeString('en-ZA', {hour12:false}),
               ...PRODUCTS.map(p => s.items[p.key] || 0), s.qty, s.method, s.amount ].join(',');
    });
    const blob = new Blob([[head.join(','), ...rows].join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kerona-konig-' + dayOf(Date.now()) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    flash($('csvBtn'), 'Saved ✓');
  });

  // Reset is visible but deliberately not tappable: it needs a 3-second press and
  // then a confirm. A stray tap on the totals screen must never wipe the day.
  // Meant for clearing the practice run before trading, not for use during service.
  (() => {
    const link = $('resetLink');
    const LABEL = 'Reset local data';
    let timer = null;

    const start = () => {
      link.classList.add('holding');
      link.textContent = 'Keep holding…';
      timer = setTimeout(() => {
        cancel();
        buzz([40,60,40]);
        if (confirm('Erase all ' + sales.length + ' stored sales from this device?\n\nThis cannot be undone. Export the CSV first.')) {
          sales = []; save(); renderTotals();
          flash(link, 'Data cleared');   // flash restores the label itself
        }
      }, 3000);
    };
    const cancel = () => {
      clearTimeout(timer); timer = null;
      link.classList.remove('holding');
      link.textContent = LABEL;
    };

    link.addEventListener('pointerdown', start);
    ['pointerup','pointercancel','pointerleave'].forEach(e => link.addEventListener(e, cancel));
    link.addEventListener('contextmenu', e => e.preventDefault());
  })();

  function flash(btn, msg){
    const old = btn.textContent; btn.textContent = msg;
    setTimeout(() => btn.textContent = old, 1400);
  }

  // ---- keep the screen awake through a trading day -------------------------
  let lock = null;
  async function keepAwake(){
    if (!('wakeLock' in navigator)) return;
    try { lock = await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });
  document.addEventListener('click', function once(){ keepAwake(); document.removeEventListener('click', once); });

  // ---- offline ------------------------------------------------------------
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  renderTill(); renderTotals();
})();
</script>
</body>
</html>
